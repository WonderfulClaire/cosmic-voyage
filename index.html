<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>COSMIC VOYAGE · 沉浸式宇宙旅行</title>
  <link rel="stylesheet" href="styles.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <canvas id="scene"></canvas>

  <!-- 座舱 HUD -->
  <div id="hud">
    <div id="crosshair"></div>
    <div id="hud-corner-tl" class="hud-corner"></div>
    <div id="hud-corner-tr" class="hud-corner"></div>
    <div id="hud-corner-bl" class="hud-corner"></div>
    <div id="hud-corner-br" class="hud-corner"></div>

    <div id="hud-bottom-left">
      <div id="hud-speed">速度 0 u/s</div>
      <div id="hud-pos">坐标 0, 0, 0</div>
    </div>

    <div id="hud-top-right">
      <div id="hud-target">最近 · —</div>
      <div id="hud-hint">按 E 查看科普</div>
    </div>

    <div id="help">
      <div class="help-title">操作指南</div>
      <div><b>W / S</b> 前进 / 后退</div>
      <div><b>A / D</b> 左右平移</div>
      <div><b>空格 / C</b> 上升 / 下降</div>
      <div><b>鼠标</b> 转动视角（点击画面锁定）</div>
      <div><b>Shift</b> 引擎加速</div>
      <div><b>E</b> 靠近天体查看科普</div>
      <div><b>星图雷达</b> 右下角小地图 + 边缘箭头指引方向</div>
      <div><b>H</b> 开关本帮助</div>
      <div class="help-tip">ESC 解除鼠标锁定 · 飞向发光的天体就能学到知识</div>
    </div>

    <!-- 星图雷达 + 边缘方向指示 -->
    <div id="minimap-wrap">
      <div class="mm-title">星图雷达</div>
      <canvas id="minimap" width="190" height="190"></canvas>
      <div class="mm-foot">半径 28k · 上北下南</div>
    </div>
    <div id="edge-markers"></div>
  </div>

  <!-- 科普卡片 -->
  <div id="card">
    <div class="card-inner">
      <button id="card-close">×</button>
      <div id="card-type" class="card-type"></div>
      <h2 id="card-title"></h2>
      <p id="card-tldr" class="card-tldr"></p>
      <ul id="card-points"></ul>
    </div>
  </div>

  <!-- 进入提示 / 开场 -->
  <div id="blocker">
    <div id="intro">
      <div class="intro-title"></div>
      <div class="intro-body"></div>
      <div class="intro-start">▶ 点击进入宇宙</div>
    </div>
  </div>

  <div id="prompt"></div>

  <script type="module" src="main.js"></script>
</body>
</html>
